# docker compose up --build   →   http://localhost:5000
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/helpdesk
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      SEED_ON_START: "true"
      SEED_DEMO: "true"

volumes:
  mongo-data:
