# Render Blueprint: one web service that serves both the API and the React build.
# MongoDB comes from MongoDB Atlas (free M0 cluster) via MONGODB_URI.
services:
  - type: web
    name: helpdesk
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SEED_ON_START
        value: "true"
      - key: SEED_DEMO
        value: "true"
